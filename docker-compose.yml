services:
  mariadb:
    image: mariadb:10.11
    container_name: precisioncast-mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=precisioncast
      - MYSQL_USER=precisioncast
      - MYSQL_PASSWORD=precisioncast123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: precisioncast-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./app/be
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=precisioncast
      - DB_PASSWORD=precisioncast123
      - DB_NAME=precisioncast
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=precisioncast-images
      - AI_WORKER_URL=http://ai_worker:8001
    volumes:
      - ./models:/app/models
      - ./app/be:/app
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend2:
    build:
      context: ./app/be
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=precisioncast
      - DB_PASSWORD=precisioncast123
      - DB_NAME=precisioncast
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=precisioncast-images
      - AI_WORKER_URL=http://ai_worker:8001
    volumes:
      - ./models:/app/models
      - ./app/be:/app
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "8000:8000"   # public API entrypoint
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      backend2:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./app/fe
      dockerfile: Dockerfile
    container_name: precisioncast-frontend
    ports:
      - "8501:8501"
    environment:
      # frontend gọi qua nginx thay vì gọi thẳng backend
      - API_URL=http://nginx:8000
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

  ai_worker:
    build:
      context: ./workers 
      dockerfile: Dockerfile
    container_name: precisioncast-worker
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - MODEL_PATH=/models/casting_model_v1.h5
    volumes:
      - ./workers:/app
      - ./models:/app/models # Mount model vào đây để worker đọc

volumes:
  mariadb_data:
  minio_data:

networks:
  default:
    name: precisioncast-network

